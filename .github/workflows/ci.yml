name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "dev"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3


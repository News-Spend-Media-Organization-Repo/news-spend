pre-commit:
  jobs:
    - run: bun run oxlint {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      stage_fixed: true
    - run: bun run oxfmt --write {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      stage_fixed: true
